services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    dns:
      - 185.12.64.1
      - 185.12.64.2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  prod:
    image: ghcr.io/ikbalrslan/optify-seo-ai:latest
    restart: unless-stopped
    dns:
      - 185.12.64.1
      - 185.12.64.2
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/data/app.db
      NEXTAUTH_URL: https://optifyseo.ai
      AUTH_URL: https://optifyseo.ai
      AUTH_TRUST_HOST: "true"
    volumes:
      - optifyseo_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  acceptance:
    image: ghcr.io/ikbalrslan/optify-seo-ai:acceptance
    restart: unless-stopped
    dns:
      - 185.12.64.1
      - 185.12.64.2
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/data/app.db
      NEXTAUTH_URL: https://acceptance.optifyseo.ai
      AUTH_URL: https://acceptance.optifyseo.ai
      AUTH_TRUST_HOST: "true"
    volumes:
      - optifyseo_acceptance_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  optifyseo_data:
  optifyseo_acceptance_data:
  caddy_data:
