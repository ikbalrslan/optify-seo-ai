# The reverse proxy (Caddy) lives outside this project, in ~/proxy on the VPS.
# prod and acceptance join its external "proxy" network under the aliases
# optifyseo-prod and optifyseo-acceptance.
services:
  prod:
    image: ghcr.io/ikbalrslan/optify-seo-ai:latest
    restart: unless-stopped
    dns:
      - 185.12.64.1
      - 185.12.64.2
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/data/app.db
      NEXTAUTH_URL: https://optifyseo.ai
      AUTH_URL: https://optifyseo.ai
      AUTH_TRUST_HOST: "true"
    volumes:
      - optifyseo_data:/data
    networks:
      default:
      proxy:
        aliases:
          - optifyseo-prod
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  acceptance:
    image: ghcr.io/ikbalrslan/optify-seo-ai:acceptance
    restart: unless-stopped
    dns:
      - 185.12.64.1
      - 185.12.64.2
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/data/app.db
      NEXTAUTH_URL: https://acceptance.optifyseo.ai
      AUTH_URL: https://acceptance.optifyseo.ai
      AUTH_TRUST_HOST: "true"
    volumes:
      - optifyseo_acceptance_data:/data
    networks:
      default:
      proxy:
        aliases:
          - optifyseo-acceptance
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  proxy:
    name: proxy
    external: true

volumes:
  optifyseo_data:
  optifyseo_acceptance_data:
