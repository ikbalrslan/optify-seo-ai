name: Deploy

on:
  push:
    branches: [master, acceptance]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      service: ${{ steps.vars.outputs.service }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "service=prod" >> "$GITHUB_OUTPUT"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "app_url=https://optifyseo.ai" >> "$GITHUB_OUTPUT"
          else
            echo "service=acceptance" >> "$GITHUB_OUTPUT"
            echo "tag=acceptance" >> "$GITHUB_OUTPUT"
            echo "app_url=https://acceptance.optifyseo.ai" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ steps.vars.outputs.app_url }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          cache-from: type=gha,scope=${{ steps.vars.outputs.service }}
          cache-to: type=gha,mode=max,scope=${{ steps.vars.outputs.service }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy docker-compose.yml and Caddyfile to VPS
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p ~/optifyseo-deploy"
          scp docker-compose.yml Caddyfile "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/optifyseo-deploy/"

      - name: Write .env and deploy
        env:
          SERVICE: ${{ needs.build-and-push.outputs.service }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GOOGLE_PAGESPEED_API_KEY: ${{ secrets.GOOGLE_PAGESPEED_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "cat > ~/optifyseo-deploy/.env" <<EOF
          AUTH_SECRET=$AUTH_SECRET
          AUTH_GOOGLE_ID=$AUTH_GOOGLE_ID
          AUTH_GOOGLE_SECRET=$AUTH_GOOGLE_SECRET
          CRON_SECRET=$CRON_SECRET
          ENCRYPTION_KEY=$ENCRYPTION_KEY
          ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
          UNSPLASH_ACCESS_KEY=$UNSPLASH_ACCESS_KEY
          GOOGLE_PAGESPEED_API_KEY=$GOOGLE_PAGESPEED_API_KEY
          SERPAPI_KEY=$SERPAPI_KEY
          STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY
          STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
          R2_ACCOUNT_ID=$R2_ACCOUNT_ID
          R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID
          R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY
          R2_BUCKET_NAME=$R2_BUCKET_NAME
          RECAPTCHA_SECRET_KEY=$RECAPTCHA_SECRET_KEY
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY=$NEXT_PUBLIC_RECAPTCHA_SITE_KEY
          EOF

          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "GH_TOKEN='$GH_TOKEN' GH_ACTOR='$GH_ACTOR' SERVICE='$SERVICE' bash -s" <<'EOF'
            set -e
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            cd ~/optifyseo-deploy
            docker compose pull "$SERVICE"
            docker compose up -d caddy "$SERVICE"
            docker compose exec -T "$SERVICE" npx prisma migrate deploy
          EOF
